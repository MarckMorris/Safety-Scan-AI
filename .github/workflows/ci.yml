name: CI

# typecheck and lint are blocking because they need no secrets and no network.
# `next build` is not run here: it requires Firebase and Google AI credentials
# that do not exist in CI, and a build job that can only ever fail is noise.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
